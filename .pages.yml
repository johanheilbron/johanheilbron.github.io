# Pages CMS configuration (https://app.pagescms.org).
# Gives a simple form-based editor for the About and Contact pages and site settings.
# The publication list and the CV are NOT edited here: they come from Johan's own
# Word files (see CLAUDE.md), and PDFs go into the bib/ folders.

media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
  - name: files
    label: Files
    input: files
    output: /files
    extensions: [pdf]

content:
  - name: about
    label: About page
    type: file
    path: content/about.md
    fields:
      - name: lead
        label: Opening sentence (shown larger)
        type: text
      - name: photo
        label: Portrait photo
        type: image
        options:
          media: images
      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - name: name
            type: string
          - name: url
            type: string
      - name: body
        label: Text
        type: rich-text

  - name: contact
    label: Contact page
    type: file
    path: content/contact.md
    fields:
      - name: body
        label: Text (address, links). The e-mail address is set separately, in encoded form.
        type: rich-text

  - name: publications-intro
    label: Publications page introduction
    type: file
    path: content/publications.md
    fields:
      - name: title
        type: string
      - name: body
        label: Introduction (optional)
        type: rich-text

  - name: site
    label: Site settings
    type: file
    path: content/site.yaml
    fields:
      - name: name
        type: string
      - name: description
        type: text
      - name: domain
        type: string
