<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="/assets/style.css?v={{ css_version }}">
</head>
<body class="page-{{ page }}">
  <header class="masthead">
    <a class="name" href="/">{{ site.name }}</a>
    <nav class="tabs" aria-label="Main">
      <a href="/"{% if page == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="/research/"{% if page == 'research' %} aria-current="page"{% endif %}>Research</a>
      <a href="/cv/"{% if page == 'cv' %} aria-current="page"{% endif %}>CV</a>
    </nav>
  </header>

  <main>
{% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    {{ site.name }}{% if site.email %} &middot; <a href="mailto:{{ site.email }}">{{ site.email }}</a>{% endif %}
  </footer>
{% block scripts %}{% endblock %}
</body>
</html>
